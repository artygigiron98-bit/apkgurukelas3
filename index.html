<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Wali Kelas SD — Asisten Administrasi Kelas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-3xl bg-white ring-1 ring-slate-200/70; box-shadow: 0 10px 30px -14px rgba(79, 70, 229, .18); }
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-95 disabled:opacity-50; }
      .btn-primary { @apply bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/30 hover:brightness-110; }
      .btn-soft { @apply bg-indigo-50 text-indigo-700 hover:bg-indigo-100; }
      .btn-ghost { @apply bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50; }
      .btn-danger { @apply bg-rose-600 text-white shadow-lg shadow-rose-500/30 hover:brightness-110; }
      .icon-btn { @apply inline-flex h-9 w-9 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-indigo-600; }
      .input { @apply w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100; }
      .label { @apply mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500; }
      .nav-item { @apply flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-semibold text-indigo-100 transition hover:bg-white/10; }
      .nav-item.active { @apply bg-white text-indigo-700 shadow-lg; }
      .bnav { @apply flex flex-1 flex-col items-center gap-0.5 py-2 text-[10px] font-semibold text-slate-400; }
      .bnav.active { @apply text-indigo-600; }
      .th { @apply px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500; }
      .td { @apply px-4 py-3 text-sm; }
      .chip { @apply inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold transition; }
      .badge { @apply inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset; }
    }
    .cell { @apply w-full bg-transparent px-2 py-3 text-center text-sm font-semibold outline-none focus:bg-indigo-50 focus:ring-2 focus:ring-inset focus:ring-indigo-400; min-width: 92px; -moz-appearance: textfield; }
    .cell::-webkit-outer-spin-button, .cell::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cell.low { color: #e11d48; background: #fff1f2; }
  </style>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .pop { animation: pop .2s ease-out; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fadeup { animation: fadeup .35s ease-out both; }
    @keyframes bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    .bar-run { animation: bar 1s ease-in-out infinite; }
    .scroll-thin::-webkit-scrollbar { height: 8px; width: 8px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    .col-focus { background: #eef2ff !important; }
    @media print { aside, header, nav, .no-print { display: none !important; } .lg\:pl-72 { padding-left: 0 !important; } }
  </style>
</head>

<body class="min-h-screen bg-slate-50 text-slate-700 antialiased">
  <!-- dekorasi latar -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -left-24 top-10 h-96 w-96 rounded-full bg-indigo-300/30 blur-3xl"></div>
    <div class="absolute right-0 top-1/3 h-96 w-96 rounded-full bg-fuchsia-300/25 blur-3xl"></div>
    <div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-sky-300/25 blur-3xl"></div>
  </div>

  <!-- progress bar atas -->
  <div id="bar" class="fixed inset-x-0 top-0 z-[60] hidden h-1 overflow-hidden bg-indigo-100">
    <div class="bar-run h-full w-1/3 rounded-full bg-gradient-to-r from-indigo-500 to-fuchsia-500"></div>
  </div>

  <!-- SIDEBAR (desktop) -->
  <aside class="fixed inset-y-0 left-0 z-30 hidden w-72 flex-col overflow-hidden bg-gradient-to-b from-indigo-700 via-violet-700 to-fuchsia-700 p-5 text-white lg:flex no-print">
    <div class="pointer-events-none absolute -right-16 -top-16 h-56 w-56 rounded-full bg-white/10"></div>
    <div class="pointer-events-none absolute -bottom-20 -left-10 h-64 w-64 rounded-full bg-white/5"></div>

    <div class="relative flex items-center gap-3 px-2 pb-6 pt-1">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-white/20 ring-1 ring-white/30 backdrop-blur">
        <i data-lucide="graduation-cap" class="h-6 w-6"></i>
      </div>
      <div>
        <p class="text-lg font-extrabold leading-tight">Wali Kelas SD</p>
        <p class="text-xs text-indigo-200">Asisten administrasi kelas</p>
      </div>
    </div>

    <nav id="side-nav" class="relative flex flex-1 flex-col gap-1.5"></nav>

    <div class="relative mt-4 rounded-2xl bg-white/10 p-4 ring-1 ring-white/15 backdrop-blur">
      <div id="mode-badge" class="mb-3"></div>
      <div class="flex items-center gap-3">
        <div id="side-avatar" class="flex h-10 w-10 items-center justify-center rounded-full bg-white/25 text-sm font-bold">W</div>
        <div class="min-w-0">
          <p id="side-wali" class="truncate text-sm font-semibold">Wali Kelas</p>
          <p id="side-kelas" class="truncate text-xs text-indigo-200">Kelas</p>
        </div>
        <button data-act="settings" class="ml-auto icon-btn !text-indigo-100 hover:!bg-white/15 hover:!text-white" title="Pengaturan">
          <i data-lucide="settings-2" class="h-5 w-5"></i>
        </button>
      </div>
    </div>
  </aside>

  <div class="lg:pl-72">
    <!-- HEADER -->
    <header class="sticky top-0 z-20 border-b border-white/60 bg-white/70 backdrop-blur-xl no-print">
      <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3 lg:px-8">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-fuchsia-600 text-white lg:hidden">
          <i data-lucide="graduation-cap" class="h-5 w-5"></i>
        </div>
        <div class="min-w-0">
          <p id="hdr-school" class="truncate text-sm font-bold text-slate-800">Sekolah</p>
          <p id="hdr-meta" class="truncate text-xs text-slate-500">Kelas • Tahun ajaran</p>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <div class="hidden items-center gap-2 rounded-xl bg-indigo-50 px-3 py-2 text-xs font-semibold text-indigo-700 sm:flex">
            <i data-lucide="calendar" class="h-4 w-4"></i><span id="hdr-date"></span>
          </div>
          <button data-act="settings" class="icon-btn lg:hidden" title="Pengaturan"><i data-lucide="settings-2" class="h-5 w-5"></i></button>
        </div>
      </div>
    </header>

    <main id="app" class="mx-auto max-w-7xl px-4 py-6 pb-28 lg:px-8 lg:pb-10">
      <div class="space-y-4">
        <div class="h-40 animate-pulse rounded-3xl bg-slate-200/70"></div>
        <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
          <div class="h-28 animate-pulse rounded-3xl bg-slate-200/70"></div><div class="h-28 animate-pulse rounded-3xl bg-slate-200/70"></div>
          <div class="h-28 animate-pulse rounded-3xl bg-slate-200/70"></div><div class="h-28 animate-pulse rounded-3xl bg-slate-200/70"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- BOTTOM NAV (mobile) -->
  <nav id="bottom-nav" class="fixed inset-x-0 bottom-0 z-30 flex border-t border-slate-200 bg-white/90 pb-[env(safe-area-inset-bottom)] backdrop-blur-xl lg:hidden no-print"></nav>

  <!-- MODAL -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-end justify-center sm:items-center sm:p-6">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" data-act="modal-close"></div>
    <div id="modal-box" class="pop relative max-h-[92vh] w-full overflow-y-auto rounded-t-3xl bg-white shadow-2xl sm:max-w-lg sm:rounded-3xl">
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-24 z-[70] flex flex-col items-center gap-2 px-4 lg:bottom-8"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
